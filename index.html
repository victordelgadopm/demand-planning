<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demand Planning Assistant</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mute:#434e5f;--line:#dfe3ea;--brand:#2b4cc7;--brand-d:#1f3a9e;
--risk:#b3261e;--risk-bg:#fdecea;--med:#b45309;--med-bg:#fff3e0;--watch:#6d4fb3;--watch-bg:#f0ebfa;--much:#0b6aa8;--much-bg:#e5f2fb;--ok:#2e7d32;--ok-bg:#e8f5e9;
--shadow:0 1px 2px rgba(20,30,50,.08),0 4px 14px rgba(20,30,50,.06);--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151c;--card:#19212c;--ink:#e8edf4;--mute:#d0d8e4;--line:#2a3544;--brand:#7d9bff;--brand-d:#a9bcff;
--risk:#ff8a80;--risk-bg:#3a1c1a;--med:#ffb55a;--med-bg:#3a2a12;--watch:#c0abf5;--watch-bg:#2a2340;--much:#7cc4f2;--much-bg:#12293a;--ok:#7bd48a;--ok-bg:#16301b;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#10151c;--card:#19212c;--ink:#e8edf4;--mute:#d0d8e4;--line:#2a3544;--brand:#7d9bff;--brand-d:#a9bcff;
--risk:#ff8a80;--risk-bg:#3a1c1a;--med:#ffb55a;--med-bg:#3a2a12;--watch:#c0abf5;--watch-bg:#2a2340;--much:#7cc4f2;--much-bg:#12293a;--ok:#7bd48a;--ok-bg:#16301b;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1320px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 80px max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.badge-sample{background:var(--watch-bg);color:var(--watch);border:1px solid var(--watch);border-radius:99px;padding:3px 12px;font-weight:600;font-size:.85rem}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 11px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--brand)}.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand-d)}.btn.sm{padding:5px 10px;font-size:.85rem}.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.health{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;padding:10px 16px;margin:16px 0;font-size:.92rem}
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:2px 10px;font-weight:600;font-size:.82rem;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.ok-t{color:var(--ok)}.warn-t{color:var(--med)}.bad-t{color:var(--risk)}
.since{padding:14px 18px;margin-bottom:16px}.since h2{margin:0 0 8px;font-size:1rem}
.since ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 20px}
.since li{font-size:.94rem}.since li b{font-weight:700}
.since a{color:var(--brand);cursor:pointer;text-decoration:underline}
.decisions{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
@media(max-width:900px){.decisions{grid-template-columns:repeat(2,1fr)}}
.dtile{text-align:left;padding:16px 18px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.dtile:hover{border-color:var(--brand)}.dtile[aria-pressed=true]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--card))}
.dtile .t{font-weight:700;font-size:1.05rem}.dtile .n{font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.dtile .d{color:var(--mute);font-size:.9rem}.dtile .h{font-size:.82rem;color:var(--mute);margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-weight:600;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:18px 0 12px}
.tab{border:0;background:none;padding:10px 16px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected=true]{color:var(--brand);border-color:var(--brand)}
input[type=search],select,input[type=number],input[type=text],textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card);color:var(--ink)}
table.list{width:100%;border-collapse:separate;border-spacing:0}
.list th{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:var(--hh,56px);background:var(--card)}
.list td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.list tr.r{cursor:pointer}.list tr.r:hover td{background:color-mix(in srgb,var(--brand) 6%,var(--card))}
.list .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sku-name{font-weight:650}.sku-id{color:var(--mute);font-size:.82rem}
.tier{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:3px 9px;font-weight:700;font-size:.82rem;white-space:nowrap}
.t-risk{background:var(--risk-bg);color:var(--risk)}.t-med{background:var(--med-bg);color:var(--med)}.t-watch{background:var(--watch-bg);color:var(--watch)}
.t-much{background:var(--much-bg);color:var(--much)}.t-ok{background:var(--ok-bg);color:var(--ok)}
.conf{font-size:.8rem;color:var(--mute)}.tag{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mute);margin-right:4px;white-space:nowrap}
.re{background:var(--risk);color:#fff;border-radius:6px;padding:1px 7px;font-size:.75rem;font-weight:700;margin-left:6px}
.empty{padding:34px;text-align:center;color:var(--mute)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40;display:none}.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:41;transform:translateX(105%);transition:transform .22s;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.drawer.on{transform:none}.drawer.narrow{width:min(520px,100%)}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
.dr-h{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:12px;align-items:flex-start;z-index:2}
.dr-b{padding:18px 20px 60px;display:grid;gap:16px}
.sec{padding:16px 18px}.sec h3{margin:0 0 10px;font-size:1rem}
.hl{font-size:1.2rem;font-weight:700;margin:6px 0 2px}
.ev{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:.94rem}.ev div:nth-child(odd){color:var(--mute)}.ev div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.src{font-size:.7rem;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.s-planning{background:#e3ebff;color:#2b4cc7}.s-bi{background:#e6f6ea;color:#1f7a34}.s-sharepoint{background:#fdf0dc;color:#8a5200}.s-calc{background:#eceff3;color:#44505f}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}.opt b{display:block}.opt span{color:var(--mute);font-size:.9rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.two{grid-template-columns:1fr}}
svg.ch{width:100%;height:auto;display:block;font-family:inherit}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.84rem;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.slider{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.verdict{margin-top:8px;padding:10px 14px;border-radius:9px;font-weight:650}
.v-bad{background:var(--risk-bg);color:var(--risk)}.v-ok{background:var(--ok-bg);color:var(--ok)}
.note-box{border-left:4px solid var(--brand);background:color-mix(in srgb,var(--brand) 7%,var(--card));padding:10px 14px;border-radius:0 9px 9px 0;margin-bottom:10px}
.hist{font-size:.85rem;color:var(--mute);margin:6px 0 0;padding-left:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
label.f{display:grid;gap:3px;font-size:.88rem;font-weight:600}
.set-row{display:grid;grid-template-columns:1fr 110px;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.set-row small{display:block;color:var(--mute);font-weight:400}
.sw{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
/* modal */
.modal{position:fixed;inset:4vh 4vw;background:var(--card);z-index:42;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:none;flex-direction:column;overflow:hidden}.modal.on{display:flex}
.modal .m-h{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.modal .m-b{padding:18px 22px;overflow:auto;flex:1}
.flow-svg{width:100%;height:auto;max-height:46vh}
.flow-node{cursor:pointer}.flow-node:hover rect,.flow-node:focus rect{stroke:var(--brand);stroke-width:3}
.panelbox{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:12px;background:var(--bg)}
.log{list-style:none;padding:0;margin:0}.log li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;opacity:0;transform:translateY(6px);animation:in .35s forwards}
@keyframes in{to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.log li{animation:none;opacity:1;transform:none}}
/* guided */
.g-shade{position:fixed;z-index:60;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,12,22,.62);pointer-events:none;transition:all .25s;border:3px solid #ffd54a}
.g-call{position:fixed;z-index:61;width:min(380px,92vw);background:#fff;color:#1b2430;border-radius:14px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.45);font-size:1rem}
.g-call h4{margin:0 0 6px;font-size:1.05rem}.g-call .sm{color:#5d6877;font-size:.85rem}
.g-call .btn{color:#1b2430;background:#fff}.g-call .btn.pri{color:#fff;background:#2b4cc7}
.foot{color:var(--mute);font-size:.84rem;margin-top:30px}
.email{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px}
.hide{display:none!important}

@media(max-width:700px){[data-g=list],[data-g=acc-list],.panelbox{overflow-x:auto}.wrap{padding-bottom:60px}.slider{grid-template-columns:110px 1fr 56px}}
/* ---- shell: nav + simple pages ---- */
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;color:var(--mute);font-size:.95rem}
.nav button:hover{color:var(--ink);background:color-mix(in srgb,var(--brand) 8%,var(--card))}
.nav button[aria-current=page]{color:#fff;background:var(--brand)}
.view{display:none}.view.on{display:block}
.page{max-width:1080px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 90px}
.hero h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
.hero p{font-size:1.15rem;color:var(--mute);margin:0 0 6px;max-width:46em}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:22px 0}
@media(max-width:700px){.steps{grid-template-columns:1fr}}
.step{padding:22px;display:flex;flex-direction:column;gap:10px}
.step .num{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:grid;place-items:center;font-size:1.1rem}
.step h2{margin:0;font-size:1.3rem}.step p{margin:0;color:var(--mute)}
.step .ex{background:color-mix(in srgb,var(--brand) 8%,var(--card));border-radius:10px;padding:10px 12px;font-size:.95rem}
.step .go{margin-top:auto}
.routes{display:flex;flex-wrap:wrap;gap:8px}
.route{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.92rem}
.route[aria-pressed=true]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--card));color:var(--brand)}
.routebox{margin-top:12px;padding:16px 18px}
.routebox h3{margin:0 0 6px}.routebox p{margin:4px 0}
.rule{padding:16px 20px;margin:0 0 16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.rule b{font-size:1.05rem}
.rule .arrow{color:var(--mute)}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}
@media(max-width:860px){.who{grid-template-columns:1fr}}
.who .card{padding:14px 18px}.who h3{margin:0 0 4px;font-size:1rem}.who p{margin:0;color:var(--mute);font-size:.95rem}
details.it{padding:14px 20px;margin-bottom:12px}
details.it summary{cursor:pointer;font-weight:700;font-size:1.02rem}
details.it ul{padding-left:20px}details.it li{margin:6px 0}
.pg-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pg-h h1{margin:0;font-size:1.6rem}.pg-sub{color:var(--mute);margin:0 0 16px}
/* excel-style sheet */
.xl{border:1px solid #b9c0cc;background:#fff;color:#1b2430;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);font-family:Calibri,"Segoe UI",system-ui,sans-serif;font-size:.92rem}
.xl-bar{display:flex;gap:10px;align-items:center;padding:6px 10px;background:#f3f3f3;border-bottom:1px solid #d4d4d4;flex-wrap:wrap}
.xl-bar .fx{color:#217346;font-weight:700}
.xl-bar .btn{background:#fff;color:#1b2430}
.xl-scroll{max-height:62vh;overflow:auto}
table.xt{border-collapse:separate;border-spacing:0;min-width:100%}
.xt th,.xt td{border-right:1px solid #d4d4d4;border-bottom:1px solid #d4d4d4;padding:4px 8px;vertical-align:top;background:#fff;text-align:left}
.xt thead th{position:sticky;z-index:2;font-weight:400;color:#444;background:#e6e6e6;text-align:center}
.xt thead tr.letters th{top:0;font-size:.8rem;padding:2px 8px}
.xt thead tr.heads th{top:22px;background:#1f3864;color:#fff;font-weight:700;text-align:left;border-color:#3a4f80;white-space:nowrap}
.xt td.rn,.xt th.rn{position:sticky;left:0;z-index:1;background:#e6e6e6;color:#444;text-align:center;width:42px;min-width:42px;font-size:.8rem}
.xt thead th.rn{z-index:3}
.xt tbody tr{cursor:pointer}.xt tbody tr:hover td:not(.rn){background:#eef4ff}
.xt td.money,.xt th.money{text-align:right;font-variant-numeric:tabular-nums}
.xt td.st{font-weight:700;white-space:nowrap}.xt td:nth-child(3){white-space:nowrap}
.xt td.st.t-risk{background:#f8d7da;color:#842029}.xt td.st.t-med{background:#ffe5b4;color:#8a4b08}.xt td.st.t-watch{background:#e5dcf5;color:#4b2e83}.xt td.st.t-much{background:#d6eaf8;color:#0b4f7c}.xt td.st.t-ok{background:#ddf0de;color:#1e5e24}
.xt td.wide{min-width:280px}
.xl-tabs{display:flex;gap:2px;background:#f3f3f3;border-top:1px solid #d4d4d4;padding:0 8px}
.xl-tabs button{border:1px solid transparent;border-top:0;background:none;padding:6px 16px;color:#444;font-size:.9rem}
.xl-tabs button[aria-selected=true]{background:#fff;color:#217346;font-weight:700;border-color:#d4d4d4;border-bottom:3px solid #217346}
.seg{display:inline-flex;border:1px solid #bbb;border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;color:#1b2430;padding:5px 12px;font-size:.88rem;font-weight:600}
.seg button[aria-pressed=true]{background:#217346;color:#fff}
.dl{background:#217346;color:#fff;border-color:#217346}.dl:hover{background:#185c37;border-color:#185c37}
/* chat */
.chat-wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media(max-width:900px){.chat-wrap{grid-template-columns:1fr}}
.chat{padding:0;overflow:hidden;display:flex;flex-direction:column}
.chat-h{padding:10px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.msgs{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:260px;max-height:50vh;overflow:auto}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.4}
.msg.you{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:color-mix(in srgb,var(--ink) 7%,var(--card));border-bottom-left-radius:4px}
.sug{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sug .chip{text-align:left}
.chat-in{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}.chat-in input{flex:1}
.recipe{padding:16px 18px}.recipe h3{margin:0 0 8px}
.recipe ol{margin:0;padding-left:20px}.recipe li{margin:4px 0}
.simnote{font-size:.85rem;color:var(--mute);margin:8px 2px}
@media print{header.top,.xl-bar,.xl-tabs{display:none}}
.msg a{color:var(--brand);font-weight:700}.msg.you a{color:#fff}

.sec-h{margin:26px 0 4px;font-size:1.3rem}
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 16px}
@media(max-width:860px){.paths{grid-template-columns:1fr}}
.path{padding:18px 20px}.path h3{margin:6px 0 6px;font-size:1.08rem}.path p{margin:6px 0}
.path .lim{color:var(--mute);font-size:.92rem;border-top:1px solid var(--line);padding-top:8px}
.tagp{display:inline-block;background:color-mix(in srgb,var(--brand) 12%,var(--card));color:var(--brand);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700}

.paths.four{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.paths.four{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.paths.four{grid-template-columns:1fr}}
.hist{padding:18px 22px;margin:0 0 16px;border-left:5px solid var(--brand)}.hist h3{margin:0 0 6px}.hist p{margin:6px 0}.hist ul{margin:6px 0;padding-left:20px}.hist li{margin:4px 0}

.mx-wrap{overflow-x:auto;padding:0;margin-bottom:16px}
table.mx{width:100%;border-collapse:collapse;min-width:720px}
.mx th,.mx td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.mx thead th{font-size:.9rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.mx tbody th{font-size:1.1rem;width:110px}
.mx td b{display:block;font-size:1rem;margin-bottom:3px}.mx td span{font-size:.9rem;color:var(--ink)}
.mx td.yes{background:var(--ok-bg)}.mx td.yes b{color:var(--ok)}
.mx td.part{background:var(--med-bg)}.mx td.part b{color:var(--med)}
.mx td.no{background:var(--risk-bg)}.mx td.no b{color:var(--risk)}
.mx tbody tr:last-child th,.mx tbody tr:last-child td{border-bottom:0}
.mx tbody th small{display:block;font-weight:400;font-size:.8rem;color:var(--mute)}.mx tbody th{width:150px}
.mini{margin:0;padding-left:18px;color:var(--mute)}.mini li{margin:4px 0}.optl{display:block;font-size:.78rem;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.step{padding:18px 22px;gap:8px}.step .go{margin-top:6px;align-self:flex-start}.step .row{margin-top:4px}
.shead{display:flex;align-items:center;gap:12px}.shead .num{width:32px;height:32px;font-size:1rem;flex:none}.shead h2{font-size:1.2rem}
.shead .optl{margin:0 0 0 auto;background:color-mix(in srgb,var(--brand) 12%,var(--card));border-radius:99px;padding:2px 10px}
.step .quote{font-style:italic;color:var(--mute);margin:0}.step{gap:10px}

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return (f<1.5?1:f<3?2:f<7?5:10)*p}
function svgChart(o){

  (o.vlines||[]).forEach(l=>{s+=`<line x1="${X(l.x)}" x2="${X(l.x)}" y1="${m.t}" y2="${m.t+ih}" stroke="${l.color||'currentColor'}" stroke-dasharray="${l.dash||'4 4'}" stroke-width="1.5"/><text x="${X(l.x)+4}" y="${m.t+12}" font-size="12" fill="${l.color||'currentColor'}">${esc(l.label||'')}</text>`});
  (o.series||[]).forEach(se=>{let d='',pen=false;se.pts.forEach(p=>{if(p[1]==null||isNaN(p[1])){pen=false;return}d+=(pen?'L':'M')+X(p[0]).toFixed(1)+' '+Y(Math.min(Math.max(p[1],o.ymin),o.ymax)).toFixed(1);pen=true});
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.w||2.4}" ${se.dash?`stroke-dasharray="${se.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`});
  (o.marks||[]).forEach(k=>{const x=X(k.x),y=Y(k.y);
    if(k.shape==='x')s+=`<path d="M${x-6} ${y-6}L${x+6} ${y+6}M${x+6} ${y-6}L${x-6} ${y+6}" stroke="${k.color}" stroke-width="3"/>`;
    else if(k.shape==='tri')s+=`<path d="M${x} ${y-8}L${x+7} ${y+5}L${x-7} ${y+5}Z" fill="${k.color}"/>`;
    else s+=`<circle cx="${x}" cy="${y}" r="5" fill="${k.color}"/>`;

  if(o.note)s+=o.note.map((t,i)=>`<text x="${m.l+8}" y="${m.t+16+i*16}" font-size="13" font-weight="700" fill="${o.noteColor||'currentColor'}">${esc(t)}</text>`).join('');

function evidence(sku,res,f){
  const m=res.metrics,lt=m.lt,ev=[];const sup=(k,a,b)=>ev.push([k,a,b]);
  const dstr=a=>a.map(p=>fmt(p.qty)+' on '+E.fmtDate(E.weekStart(snap(),p.etaH))).join(', ')||'None';
  if(['missed_order','late_po'].includes(f.type)){
    sup('On hand',fmt(m.onHand),'planning');sup('In transit',dstr(sku.inv.transit),'planning');sup('Open POs',dstr(sku.inv.pos),'planning');
    sup('Forecast, next 12 weeks',fmt(m.needPlan),'planning');if(lt){sup('Supplier lead time (quoted)',lt.q+' weeks','sharepoint');if(lt.p80)sup('Supplier lead time (typical)',lt.p80.toFixed(1)+' weeks','calc')}
    if(f.firstH!=null)sup('First week short',E.fmtDate(E.weekStart(snap(),f.firstH)),'calc')}
  else if(f.type==='history_gap'){sup('Supply (on hand + in transit + open POs)',fmt(m.supply),'planning');sup('Forecast, next 12 weeks',fmt(m.needPlan),'planning');
    sup('Sold in these weeks last year',fmt(m.lyRaw),'bi');sup('Need after adjustments*',fmt(m.needHist),'calc');sup('Gap',fmt(f.gapUnits)+' units','calc')}
  else if(f.type==='promo_repeat'){const t=(sku.promo.ty||[])[0],l=(sku.promo.ly||[])[0];sup('Promo',(t&&t.name)||'','sharepoint');sup('Last year lift',Math.round(m.lift*100)+'%','calc');sup('Supply',fmt(m.supply),'planning');sup('Forecast without promo',fmt(m.needPlan),'planning');if(f.gapUnits)sup('Short vs promo need',fmt(f.gapUnits)+' units','calc')}
  else if(f.type==='pos_outpacing'){const l3=E.sum(sku.pos.y2026,42,45),f3=E.sum(sku.forecast26,42,45);sup('Sales, last 3 weeks',fmt(l3),'bi');sup('Forecast, same weeks',fmt(f3),'planning');sup('Ahead of forecast',Math.round((l3/f3-1)*100)+'%','calc');sup('Supply',fmt(m.supply),'planning');sup('Forecast, next 12 weeks',fmt(m.needPlan),'planning')}
  else if(f.type==='overstock'){sup('Weeks of supply',m.wos.toFixed(0),'calc');sup('On hand + in transit',fmt(m.onHand+m.transit),'planning');sup('Avg weekly forecast',fmt(E.mean(sku.fcstH)),'planning');sup('Sales trend (last 4 vs prior 4 weeks)',Math.round((E.sum(sku.pos.y2026,41,45)/E.sum(sku.pos.y2026,37,41)-1)*100)+'%','bi')}
  else if(f.type==='channel_fill'){const sh=E.sum(sku.ship.y2026,37,45),pp=E.sum(sku.pos.y2026,37,45);sup('Shipped to retailers, 8 weeks',fmt(sh),'bi');sup('Sold to shoppers, 8 weeks',fmt(pp),'bi');sup('Difference',fmt(sh-pp),'calc')}
  else if(f.type==='newitem_gap'){const a=E.analogsFor(sku,snap());sup('Forecast, first 12 weeks',fmt(m.needPlan),'planning');sup('Similar past launches (average)',fmt(a.mean),'calc');sup('Range of those launches',fmt(a.min)+' to '+fmt(a.max),'calc')}
  else if(f.type==='check_data'){(f.issues||[]).forEach(x=>sup('Issue',x,'planning'))}
  return ev;
}

   ${others.length?`<div class="card sec"><h3>Other flags on this SKU</h3>${others.map(f=>`<div style="margin-bottom:6px">${tierB(f.tier)} ${esc(f.text)}${f.accepted?' <span class="tag">accepted</span>':''}</div>`).join('')}</div>`:''}

function analogHtml(sku,res){
  const a=E.analogsFor(sku,snap()),ser=a.curves.map(c=>({pts:c.curve.map((v,i)=>[i+1,v]),color:C.y2,w:1.8})).concat([{pts:sku.fcstH.map((v,i)=>[i+1,v]),color:C.fc,w:3.2,dash:'7 4'}]);
  const ymax=niceStep(Math.max(...ser.flatMap(s=>s.pts.map(p=>p[1])))*1.15/4)*4;
  return `<div class="card sec" data-g="drill-chart"><h3>New item: forecast vs similar past launches</h3>${svgChart({xmin:.5,xmax:12.5,ymin:0,ymax,series:ser,xticks:[1,3,5,7,9,11].map(w=>[w,'Wk '+w]),label:'Analog launch curves'})}
   <div class="legend"><span><i style="border-color:${C.y2}"></i>Past launches (analogs)</span><span><i style="border-color:${C.fc};border-top-style:dashed"></i>Current forecast</span></div>
   <table class="list" style="margin-top:10px"><thead><tr><th>Analog</th><th>Why it was picked</th><th class="num">First 12 weeks</th></tr></thead><tbody>${a.curves.map(c=>`<tr><td>${esc(c.name)}<div class="sku-id">${c.id}</div></td><td>${esc(c.why)}</td><td class="num">${fmt(E.sum(c.curve))}</td></tr>`).join('')}</tbody></table>
   <p class="conf">Needs 3 or more analogs, including the weaker sellers, so the average is not cherry-picked. A planner can swap any analog.</p></div>`;
}

const PAT=[['wos',/weeks? of (stock|supply|cover)|how many weeks|wos|\bcover\b/],['ly',/last year|same weeks/],['lt',/lead ?time/],['supplier',/supplier|vendor/],['supply',/on hand|on order|in transit|units (on|of stock)|how much stock|stock (we have|on)/],['owner',/owner|who owns|responsible|assigned/],['note',/\bnotes?\b|comment/],['conf',/confidence|how sure/],['dollars',/dollar|\$|money|value/],['sub',/subcategor|category/],['todo',/what to do|next step|action/]];
const RM=/remove|hide|drop|don'?t need|do not need|get rid|take out|without|delete/;
function reply(text){
  const t=text.toLowerCase();
  if(/show all|all items|every (item|sku)|not just/.test(t)){rowsMode='all';return 'Done. The sheet now shows all items, not just the ones that need attention. Your recipe is updated.'}
  if(/only.*attention|needs? attention/.test(t)&&!/add|column/.test(t)){rowsMode='attn';return 'Done. The sheet shows only the items that need attention.'}
  const hit=PAT.find(p=>p[1].test(t));
  if(hit){const k=hit[0],C=COLS[k],has=cols.includes(k);
    if(RM.test(t)){if(C.core)return `I would keep "${C.h}" because the sheet is hard to read without it. I can hide any of the other columns.`;
      if(!has)return `"${C.h}" is not in your sheet right now.`;cols=cols.filter(x=>x!==k);saveCols();return `Done. I removed "${C.h}" from the sheet and from your recipe.`}
    if(has)return `"${C.h}" is already in your sheet.`;
    cols.push(k);saveCols();
    return `Done. I added "${C.h}" ${C.src||''}. I saved it in your recipe, so tomorrow's sheet has it too. <a href="#" data-see>See it in the sheet</a>`}
  return 'I only know a few requests in this demo. In the real chat you would explain it in your own words, and the AI works out which data to use. If the data is not in your files, it asks you where to find it or what file to add.';

  <p class="pg-sub">You shape the sheet by talking to the AI, not by editing settings. Start with a full prompt about what you want, then adjust anytime by saying what you are not seeing. It remembers for next time.</p>
  <div class="chat-wrap"><div class="leftcol"><div class="card chat"><div class="chat-h"><span>Chat With The AI</span><span class="conf">Demo only: simulated replies</span></div>
   <div class="msgs" id="msgs" aria-live="polite">${msgs.map(m=>`<div class="msg ${m.w}">${m.w==='you'?esc(m.t):m.t}</div>`).join('')}</div>
   <div class="sug">${SUG.map((s,i)=>`<button class="chip" data-sug="${i}">${esc(s)}</button>`).join('')}</div>
   <form class="chat-in" id="chat-f"><input type="text" id="chat-t" placeholder="Type what you are not seeing" aria-label="Message"><button class="btn pri" type="submit">Send</button></form></div>
   <div class="card recipe" style="margin-top:14px"><h3>Example Prompts To Start With</h3><ul class="mini"><li><b>Match a format:</b> “Here are two sheets I like. Make the daily sheet look exactly like the first, with the color rules from the second.”</li><li><b>Blend documents:</b> “Combine the layout of this report with the columns from that one.”</li><li><b>Combine data:</b> “Join the Anaplan forecast and the Tableau sales by SKU, and flag any item where sales are above forecast and stock is low.”</li></ul></div></div>
  <div><div class="card recipe"><h3>Your Recipe</h3><p class="conf" style="margin:0 0 8px">The AI's memory of how your sheet is built. Scheduled runs read it every morning.</p>
   <ol>${cols.map(k=>`<li>${esc(COLS[k].h)}</li>`).join('')}</ol>
   <p style="margin:10px 0 0"><b>Rows:</b> ${rowsMode==='all'?'All items':'Items that need attention'}</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn pri" data-nav="sheet">Preview The Sheet</button><button class="btn" id="c-reset">Reset Columns</button></div></div>
   <div class="card recipe" style="margin-top:14px"><h3>How This Works In Real Life</h3><ol><li>You describe what you want, or what you are not seeing, in your own words.</li><li>The AI finds the field in your data, or asks you where it lives.</li><li>It updates the recipe and rebuilds the sheet.</li><li>Tomorrow's scheduled run uses the saved recipe.</li></ol>
   <p style="margin:10px 0 0"><button class="btn sm" id="c-adv">Advanced Thresholds</button></p></div></div></div></div>`;
  const v=$('#v-custom'),box=$('#msgs');box.scrollTop=box.scrollHeight;
  const send=t=>{if(!t.trim())return;msgs.push({w:'you',t});msgs.push({w:'ai',t:reply(t)});renderCustom();renderSheet()};
  $$('[data-sug]',v).forEach(b=>b.onclick=()=>send(SUG[b.dataset.sug]));
  $('#chat-f').onsubmit=e=>{e.preventDefault();send($('#chat-t').value)};
  $$('[data-see]',v).forEach(a=>a.onclick=e=>{e.preventDefault();go('sheet')});
  $$('[data-nav]',v).forEach(b=>b.onclick=()=>go(b.dataset.nav));
  $('#c-reset').onclick=()=>{cols=DEFAULT.slice();rowsMode='attn';saveCols();msgs=[hello()];renderCustom();renderSheet()};
  $('#c-adv').onclick=A.openSettings;
}
/* ---------- routing ---------- */
const VIEWS=['home','sheet','custom','visual','options'];
function go(v){
  if(!VIEWS.includes(v))v='home';A.closeAll();
  VIEWS.forEach(x=>$('#v-'+x).classList.toggle('on',x===v));
  $$('.nav button').forEach(b=>{if(b.dataset.nav===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(v==='sheet')renderSheet();if(v==='custom')renderCustom();if(v==='visual')A.renderApp();
  if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);window.scrollTo(0,0);
  const h=$('header.top');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px');
}
function renderAll(){renderHome();renderOptions();renderSheet();renderCustom();A.renderApp()}
$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.nav));
addEventListener('hashchange',()=>go(location.hash.slice(1)));
renderAll();go(location.hash.slice(1)||'home');
window.__shell={go,downloadXlsx,cols:()=>cols,reply,COLS};
})();
</script>
